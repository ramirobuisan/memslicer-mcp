[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memslicer"
version = "0.1.0"
description = "Memory scanner for macOS game processes (incl. Wine/CrossOver/NotProton) with an MCP server so Claude can drive it"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "mcp>=1.10"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
memslicer = "memslicer.cli:main"
memslicer-mcp = "memslicer.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
